<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  Stage review page (toon-video, rules S1 and S2 approvals). Fill the JSON in #page-data, then publish with
  capabilities {"db":{"rules":[{"path":"","read":"view","write":"owner"}]},"user":{}}.
  Only the artifact's owner can write, so the Approve button records the owner's own click. Agents never write the
  `approvals` collection: they read it (ArtifactData list approvals) into src/stories/<slug>/approvals.json for the gate.
  Collections: approvals/<stage> {stage, story, approved, at, note, by, source: "page"}; notes/<stage>-<ms> {stage, text, at, by}.
-->
<script id="page-data" type="application/json">
{
  "story": "example-2d",
  "stage": "story",
  "title": "Example: story and narration",
  "ask": "Listen to the story. Approve it, or write what to change.",
  "items": [
    { "kind": "video", "src": "v/animatic.mp4", "caption": "Stills on the voice" },
    { "kind": "image", "src": "c/cast.jpg", "caption": "The cast" }
  ]
}
</script>
<style>
/* Layout: one column, media first, the decision bar last */
:root{--bg:#f7f6f2;--fg:#1d1f23;--mute:#62656c;--line:#dedbd2;--card:#fff;--go:#2f7d4f;--goFg:#fff;--warn:#a85d00;
--display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--fg:#e9e7e2;--mute:#a4a7ae;--line:#34363b;--card:#202226;--go:#5cc08a;--goFg:#0d1a12;--warn:#e3a94a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16171a;--fg:#e9e7e2;--mute:#a4a7ae;--line:#34363b;--card:#202226;--go:#5cc08a;--goFg:#0d1a12;--warn:#e3a94a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
main{max-width:760px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-size:24px;margin:0;text-wrap:balance}
.mute{color:var(--mute)}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
video,img{width:100%;max-width:100%;border-radius:8px;background:#000}
.bar{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:90px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:9px 16px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.go{background:var(--go);color:var(--goFg);border-color:var(--go)}
button:focus-visible{outline:2px solid var(--go);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
#state{font-weight:600}
</style>
<main>
  <h1 id="title"></h1>
  <p id="ask" class="mute"></p>
  <div id="items" style="display:flex;flex-direction:column;gap:18px"></div>
  <section class="bar" aria-label="Decision">
    <p id="state" class="mute">Loading your decision…</p>
    <label for="note" class="mute">Notes (what to change)</label>
    <textarea id="note"></textarea>
    <div class="row">
      <button id="approve" class="go" disabled>Approve</button>
      <button id="send" disabled>Send notes</button>
    </div>
  </section>
</main>
<script>
const D = JSON.parse(document.getElementById('page-data').textContent);
document.getElementById('title').textContent = D.title;
document.getElementById('ask').textContent = D.ask;
const box = document.getElementById('items');
for (const it of D.items) {
  const f = document.createElement('figure');
  const m = document.createElement(it.kind === 'video' ? 'video' : 'img');
  m.src = it.src; if (it.kind === 'video') { m.controls = true; m.playsInline = true; m.preload = 'metadata'; } else m.alt = it.caption || '';
  const c = document.createElement('figcaption'); c.className = 'mute'; c.textContent = it.caption || '';
  f.append(m, c); box.append(f);
}
const stateEl = document.getElementById('state'), approveB = document.getElementById('approve'), sendB = document.getElementById('send'), note = document.getElementById('note');
const show = (t) => { stateEl.textContent = t; };
(async () => {
  const db = await window.claude?.use?.('db'), user = await window.claude?.use?.('user');
  if (!db) { show('Approvals cannot be saved in this view. Open the page in claude.ai.'); return; }
  const owner = user ? user.isOwner() : false;
  if (!owner) show('Only the owner can approve this stage.');
  const ref = db.doc('approvals/' + D.stage);
  const timer = setTimeout(() => show('Your decision cannot be reached yet.'), 10000);
  ref.onSnapshot(s => {
    if (!s.metadata.fromCache) clearTimeout(timer);
    const d = s.exists ? s.data() : null;
    if (d && d.approved) show('Approved ' + new Date(d.at).toLocaleString() + '.');
    else if (owner) show('Not approved yet.');
  }, () => { clearTimeout(timer); show('Your decision cannot be read right now.'); });
  if (!owner) return;
  approveB.disabled = false; sendB.disabled = false;
  const by = user ? await user.id() : null;
  approveB.addEventListener('click', async () => {
    approveB.disabled = true;
    try { await ref.set({ stage: D.stage, story: D.story, approved: true, at: Date.now(), note: note.value.trim(), by, source: 'page' }); }
    catch (e) { show('Approve failed: ' + (e && e.message || 'try again')); }
    approveB.disabled = false;
  });
  sendB.addEventListener('click', async () => {
    const text = note.value.trim(); if (!text) { show('Write a note first.'); return; }
    sendB.disabled = true;
    try { await db.doc('notes/' + D.stage + '-' + Date.now()).set({ stage: D.stage, story: D.story, text, at: Date.now(), by }); note.value = ''; show('Notes sent. The stage stays open until you approve.'); }
    catch (e) { show('Sending failed: ' + (e && e.message || 'try again')); }
    sendB.disabled = false;
  });
})();
</script>
